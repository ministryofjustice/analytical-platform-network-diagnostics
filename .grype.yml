---
# Grype configuration for container vulnerability scanning.
# These vulnerabilities are reported from /usr/bin/pebble bundled in the
# upstream Ubuntu base image and are not directly patchable in this repository.

ignore: 
  # OpenSSL in base image, fixed by pinning 3.5.5-1ubuntu3.6 in Dockerfile
  - vulnerability: CVE-2026-72897
    package:
      name: libssl3t64
      version: 3.5.5-1ubuntu3.5
    reason: "Fixed in Dockerfile by pinning libssl3t64=3.5.5-1ubuntu3.6."
