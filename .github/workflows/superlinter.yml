---
name: Super Linter

"on":
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  super-linter:
    name: Super Linter
    permissions:
      contents: read
      packages: read
      statuses: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/super-linter.yml@7254f4a35b6251bf442bf84335b6bd27f9d88689 # v4.1.4
    with:
      super-linter-variables: |
        {
          "LINTER_RULES_PATH": "."
        }
