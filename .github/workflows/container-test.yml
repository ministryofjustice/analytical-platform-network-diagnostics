---
name: Container Test

"on":
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  container-test:
    name: Container Test
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/container-test.yml@634721c67e9e1e3502c9a737fc102093ac0cf482 # v4.2.0
    with:
      containerfile-path: Dockerfile
