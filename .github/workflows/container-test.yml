---
name: Container Test

"on":
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  container-test:
    name: Container Test
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/container-test.yml@feb7a2d3220db8dcd1b541e43fa5596af398c491 # v4.1.3
    with:
      containerfile-path: Dockerfile
