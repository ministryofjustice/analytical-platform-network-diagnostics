---
name: Container Release

"on":
  push:
    tags:
      - "*"
  workflow_dispatch: {}

permissions: {}

jobs:
  container-release:
    name: Container Release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/container-release.yml@sbom_size # v4.1.2
    with:
      containerfile-path: Dockerfile
